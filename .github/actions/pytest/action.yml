name: "Pytest"
description: "Run pytest for a Python project (pinned install optional; writes Job Summary on failure)"

inputs:
  python_version:
    description: "Python version to use"
    required: false
    default: "3.11"

  working_directory:
    description: "Directory to run from (repo root relative)"
    required: false
    default: "."

  requirements_file:
    description: "Requirements file path relative to working_directory (installed before running pytest)"
    required: false
    default: "requirements.txt"

  extra_install_args:
    description: "Optional extra pip args for installing requirements (e.g. --no-deps)"
    required: false
    default: ""

  pytest_version:
    description: "Exact pytest version to install (pin for reproducible CI)"
    required: false
    default: "8.4.0"

  pytest_args:
    description: "Space-separated pytest args. Empty = auto (-q tests if ./tests exists, else -q test if ./test exists, else -q)."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail

        if [ -z "${{ inputs.requirements_file }}" ]; then
          echo "requirements_file must be a non-empty relative path." >&2
          exit 1
        fi

        case "${{ inputs.requirements_file }}" in
          /*)
            echo "requirements_file must be relative (no leading slash): ${{ inputs.requirements_file }}" >&2
            exit 1
            ;;
        esac

        if [[ "${{ inputs.requirements_file }}" =~ (^|/)\.\.(/|$) ]]; then
          echo "requirements_file must not traverse parents (..): ${{ inputs.requirements_file }}" >&2
          exit 1
        fi

        if [ ! -f "${{ inputs.requirements_file }}" ]; then
          echo "requirements_file not found: ${{ inputs.requirements_file }} (cwd: $PWD)" >&2
          exit 1
        fi

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install dependencies (incl. pytest)
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail
        python -m pip install --disable-pip-version-check -q -U pip

        extra=()
        if [ -n "${{ inputs.extra_install_args }}" ]; then
          read -r -a extra <<< "${{ inputs.extra_install_args }}"
        fi

        python -m pip install --disable-pip-version-check -q "${extra[@]}" -r "${{ inputs.requirements_file }}"

        python -m pip install --disable-pip-version-check -q "pytest==${{ inputs.pytest_version }}"

    - name: Run pytest
      id: pytest
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail
        # Repo root on PYTHONPATH so tests can `import app` when app lives at project root.
        export PYTHONPATH="$(pwd):${PYTHONPATH:-}"

        pytest_args=()
        _pa="${{ inputs.pytest_args }}"
        if [ -z "$_pa" ]; then
          if [ -d tests ]; then
            _pa="-q tests"
          elif [ -d test ]; then
            _pa="-q test"
          else
            _pa="-q"
          fi
        fi
        read -r -a pytest_args <<< "$_pa"

        set +e
        python -m pytest "${pytest_args[@]}"
        exit_code=$?
        set -e

        if [ "$exit_code" -ne 0 ]; then
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## Pytest failed — fix locally"
              echo ""
              echo "Run the same commands locally, then **commit** and **push** again."
              echo ""
              # Single-quoted fences: backticks in double-quoted echo are command substitution in bash.
              echo '```bash'
              echo "python -m pip install -r ${{ inputs.requirements_file }}"
              echo "python -m pip install pytest==${{ inputs.pytest_version }}"
              echo "python -m pytest $_pa"
              echo '```'
              echo ""
              echo "See the job log above for the failing test output."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "Pytest failed (exit_code=$exit_code). See Summary tab for copy-paste." >&2
          exit "$exit_code"
        fi

        echo "Pytest passed."
