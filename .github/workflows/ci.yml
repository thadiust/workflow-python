name: "Python Security Pipeline"

# Least privilege for the default GITHUB_TOKEN (checkout + read-only scans).
permissions:
  contents: read

# One group per repo+ref: new pushes cancel older runs still in progress (saves minutes).
concurrency:
  group: python-security-pipeline-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory containing the Python project to scan"
        required: false
        type: string
        default: "."
      requirements_file:
        description: "Requirements file path relative to working_directory"
        required: false
        type: string
        default: "requirements.txt"
      python_version:
        description: "Python version for the scan jobs"
        required: false
        type: string
        default: "3.11"
      fail_on_vuln:
        description: "Fail the pip-audit job when vulnerabilities are found"
        required: false
        type: boolean
        default: true
      run_gitleaks:
        description: "Whether to run the Gitleaks secrets scan job (runs first when enabled)"
        required: false
        type: boolean
        default: true
      run_pip_audit_scan:
        description: "Whether to run the pip-audit dependency scan job"
        required: false
        type: boolean
        default: true
      run_bandit:
        description: "Whether to run the Bandit SAST job"
        required: false
        type: boolean
        default: true
      bandit_config:
        description: "Optional Bandit config file path relative to working_directory (e.g. bandit.yaml)"
        required: false
        type: string
        default: ""
      bandit_minimum_severity:
        description: "Lowest Bandit severity to report and count toward fail_on_findings (all, low, medium, high). Use medium to ignore low-only issues."
        required: false
        type: string
        default: "all"
  workflow_dispatch:
    inputs:
      working_directory:
        description: "Directory containing the Python project to scan"
        required: false
        type: string
        default: "."
      requirements_file:
        description: "Requirements file path relative to working_directory"
        required: false
        type: string
        default: "requirements.txt"
      python_version:
        description: "Python version for the scan jobs"
        required: false
        type: string
        default: "3.11"
      fail_on_vuln:
        description: "Fail the pip-audit job when vulnerabilities are found"
        required: false
        type: boolean
        default: true
      run_gitleaks:
        description: "Whether to run the Gitleaks secrets scan job (runs first when enabled)"
        required: false
        type: boolean
        default: true
      run_pip_audit_scan:
        description: "Whether to run the pip-audit dependency scan job"
        required: false
        type: boolean
        default: true
      run_bandit:
        description: "Whether to run the Bandit SAST job"
        required: false
        type: boolean
        default: true
      bandit_config:
        description: "Optional Bandit config file path relative to working_directory (e.g. bandit.yaml)"
        required: false
        type: string
        default: ""
      bandit_minimum_severity:
        description: "Lowest Bandit severity to report and count toward fail_on_findings (all, low, medium, high). Use medium to ignore low-only issues."
        required: false
        type: string
        default: "all"

jobs:
  # Gitleaks first; Bandit and pip-audit run in parallel after it (each only needs gitleaks-scan).
  gitleaks-scan:
    if: ${{ inputs.run_gitleaks }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        id: gitleaks
        uses: thadiust/secrets-gitleaks@main
        with:
          working_directory: ${{ inputs.working_directory }}
          fail_on_findings: true

  bandit-scan:
    needs:
      - gitleaks-scan
    if: ${{ inputs.run_bandit && !cancelled() && (needs['gitleaks-scan'].result == 'success' || needs['gitleaks-scan'].result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Bandit SAST
        id: bandit
        uses: thadiust/sast-bandit@main
        with:
          python_version: ${{ inputs.python_version }}
          working_directory: ${{ inputs.working_directory }}
          targets: "."
          fail_on_findings: true
          bandit_config: ${{ inputs.bandit_config }}
          minimum_severity: ${{ inputs.bandit_minimum_severity }}

  pip-audit-scan:
    needs:
      - gitleaks-scan
    if: ${{ inputs.run_pip_audit_scan && !cancelled() && (needs['gitleaks-scan'].result == 'success' || needs['gitleaks-scan'].result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run pip-audit scan
        id: pip_audit
        uses: thadiust/pip-audit-scan-action@main
        with:
          python_version: ${{ inputs.python_version }}
          working_directory: ${{ inputs.working_directory }}
          requirements_file: ${{ inputs.requirements_file }}
          fail_on_vuln: ${{ inputs.fail_on_vuln }}
