name: "Python Security Pipeline"

# Least privilege for the default GITHUB_TOKEN (checkout + read-only scans).
permissions:
  contents: read

# One group per repo+ref: new pushes cancel older runs still in progress (saves minutes).
concurrency:
  group: python-security-pipeline-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory containing the Python project to scan"
        required: false
        type: string
        default: "."
      requirements_file:
        description: "Fully pinned requirements / lock file path relative to working_directory (pip-audit -r; pytest can use the same file for one install graph)"
        required: false
        type: string
        default: "requirements.txt"
      enforce_pip_tools_lockfile:
        description: "If true, run pip-compile before pip-audit and fail CI when requirements_file is not reproducible from pip_tools_requirements_in (pip + lockfile discipline)"
        required: false
        type: boolean
        default: false
      pip_tools_requirements_in:
        description: "pip-compile input file when enforce_pip_tools_lockfile is true (relative to working_directory)"
        required: false
        type: string
        default: "requirements.in"
      pip_tools_version:
        description: "Exact pip-tools version for the lockfile enforcement step"
        required: false
        type: string
        default: "7.5.3"
      pip_tools_require_hashed_install:
        description: "If true with enforce_pip_tools_lockfile, fail when pip_tools_version is not 7.5.3 (no bundled hash constraints for other versions)"
        required: false
        type: boolean
        default: false
      python_version:
        description: "Python version for pre-commit, pytest, Bandit, and pip-audit jobs"
        required: false
        type: string
        default: "3.11"
      fail_on_vuln:
        description: "Fail the pip-audit job when vulnerabilities are found"
        required: false
        type: boolean
        default: true
      run_pre_commit:
        description: "Run pre-commit run --all-files using the caller repo's .pre-commit-config.yaml (align hook revs with local pre-commit install before push)"
        required: false
        type: boolean
        default: true
      run_gitleaks:
        description: "Run secrets-gitleaks in parallel with pre-commit-check (full git history; SARIF when upload_code_scanning is true). Pre-commit still runs the Gitleaks hook when run_pre_commit is true — set false here to skip only the CI job and avoid duplicate minutes if the hook is enough"
        required: false
        type: boolean
        default: true
      gitleaks_version:
        description: "Exact Gitleaks release version (no v prefix); passed to secrets-gitleaks. Align .pre-commit-config.yaml gitleaks rev when you care about version parity"
        required: false
        type: string
        default: "8.18.4"
      pip_audit_version:
        description: "Exact pip-audit version (passed to pip-audit-scan-action)"
        required: false
        type: string
        default: "2.7.3"
      run_pytest:
        description: "Whether to run pytest (after pre-commit-check and gitleaks-scan when those jobs are enabled or skipped by toggle)"
        required: false
        type: boolean
        default: true
      pytest_requirements_file:
        description: "Requirements file path (relative to working_directory) used for pytest installs"
        required: false
        type: string
        default: "requirements.txt"
      pytest_version:
        description: "Exact pytest version for the test job"
        required: false
        type: string
        default: "9.0.2"
      pytest_args:
        description: "Space-separated pytest args. Leave empty for auto: -q tests if ./tests exists, else -q test if ./test exists, else -q (discovery)."
        required: false
        type: string
        default: ""
      pytest_app_require_hashes:
        description: "If true, pytest job uses pip --require-hashes when installing pytest_requirements_file (file must include PEP 503 hashes, e.g. pip-compile --generate-hashes)"
        required: false
        type: boolean
        default: false
      run_pip_audit_scan:
        description: "Whether to run the pip-audit dependency scan job"
        required: false
        type: boolean
        default: true
      run_bandit:
        description: "Whether to run the Bandit SAST job"
        required: false
        type: boolean
        default: true
      bandit_config:
        description: "Optional Bandit config file path relative to working_directory (e.g. bandit.yaml)"
        required: false
        type: string
        default: ""
      bandit_exclude:
        description: "Comma-separated paths to exclude from Bandit (relative to working_directory). Empty = scan the whole tree including tests (recommended). Use e.g. tests if you need to drop test dirs from Bandit."
        required: false
        type: string
        default: ""
      bandit_targets:
        description: "Space-separated paths for Bandit -r, each relative to working_directory (e.g. src or pkg src tests)"
        required: false
        type: string
        default: "."
      bandit_minimum_severity:
        description: "Lowest Bandit severity to report and count toward fail_on_findings (all, low, medium, high). Use medium to ignore low-only issues."
        required: false
        type: string
        default: "all"
      bandit_version:
        description: "Exact Bandit version for the SAST job (passed to sast-bandit)"
        required: false
        type: string
        default: "1.9.4"

      run_trivy:
        description: "Whether to run Trivy filesystem + config scans (after pytest, in parallel with Bandit and pip-audit when enabled)"
        required: false
        type: boolean
        default: true
      trivy_version:
        description: "Exact Trivy version for the scan job (must exist on aquasecurity/trivy releases)"
        required: false
        type: string
        default: "0.69.3"
      trivy_mode:
        description: "Trivy scan mode: fs, config, or both"
        required: false
        type: string
        default: "both"
      trivy_paths:
        description: "Space-separated paths relative to working_directory to scan with Trivy"
        required: false
        type: string
        default: "."
      trivy_severity:
        description: "Comma-separated severities to include (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)"
        required: false
        type: string
        default: "HIGH,CRITICAL"
      trivy_ignore_unfixed:
        description: "If true, ignore vulnerabilities without a fix"
        required: false
        type: boolean
        default: true
      trivy_fail_on_findings:
        description: "Fail the Trivy repository (fs/config) job when one or more findings are reported"
        required: false
        type: boolean
        default: true
      trivy_image_fail_on_findings:
        description: "Fail the Trivy container image job when findings are reported (same idea as trivy_fail_on_findings for the repo). Default true — CI stays strict. Set false only when you still want SARIF/Code Scanning signal but base-image OS noise would block merges (document that choice in the caller)."
        required: false
        type: boolean
        default: true

      run_docker_build:
        description: "Build a Docker image after repo Trivy (trivy-repo-scan) succeeds; image is saved and passed to an optional Trivy image scan job"
        required: false
        type: boolean
        default: false
      dockerfile:
        description: "Dockerfile path relative to the Docker build context directory"
        required: false
        type: string
        default: "Dockerfile"
      docker_context:
        description: "Docker build context relative to repo root; leave empty to use working_directory"
        required: false
        type: string
        default: ""
      docker_image_tag:
        description: "Local image tag for docker build, docker save/load, and Trivy image scan"
        required: false
        type: string
        default: "workflow-python-ci:scan"
      run_trivy_image_scan:
        description: "When run_docker_build is true, run Trivy container scan on the built image (leaf job — Bandit/pip-audit do not wait on it)"
        required: false
        type: boolean
        default: true

      upload_code_scanning:
        description: "Upload Gitleaks (when run_gitleaks), Bandit, Trivy repo SARIF, and optional Trivy image SARIF to GitHub Code Scanning (Security tab / PR). Caller job needs security-events: write. No-op if Advanced Security is off (upload step uses continue-on-error)."
        required: false
        type: boolean
        default: true

      run_runner_info:
        description: "If true, run a tiny runner-info job (OS/arch/name). Set false to save a job slot; no effect on security gates."
        required: false
        type: boolean
        default: true

jobs:
  # Logs documented runner context (no runner.version in schema — use os/arch/environment/name).
  runner-info:
    if: ${{ inputs.run_runner_info != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Runner info
        run: |
          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          echo "runner.environment=${{ runner.environment }}"
          echo "runner.name=${{ runner.name }}"

  # Fast gate: pre-commit-check ∥ gitleaks-scan (optional full-history detect + SARIF; hook still in pre-commit when run_pre_commit is on). Then pytest. Then Trivy, Bandit, pip-audit in parallel.
  # Docker build runs only after that wave (each job may be skipped only when its toggle is off). Then Trivy image scan (leaf).
  pre-commit-check:
    if: ${{ inputs.run_pre_commit != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.0

  gitleaks-scan:
    if: ${{ inputs.run_gitleaks && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        id: gitleaks
        uses: thadiust/secrets-gitleaks@main
        with:
          gitleaks_version: ${{ inputs.gitleaks_version }}
          working_directory: ${{ inputs.working_directory }}
          fail_on_findings: true
          write_sarif: ${{ inputs.upload_code_scanning }}
          sarif_filename: gitleaks-results.sarif

      - name: Upload Gitleaks SARIF to GitHub Code Scanning
        if: ${{ inputs.upload_code_scanning != false && (success() || failure()) && steps.gitleaks.outputs.sarif_path != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.gitleaks.outputs.sarif_path }}
          category: gitleaks

  pytest-test:
    needs:
      - pre-commit-check
      - gitleaks-scan
    if: ${{ always() && inputs.run_pytest && !cancelled() && (needs['pre-commit-check'].result == 'success' || needs['pre-commit-check'].result == 'skipped') && (needs['gitleaks-scan'].result == 'success' || (needs['gitleaks-scan'].result == 'skipped' && inputs.run_gitleaks == false)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run pytest
        uses: thadiust/workflow-python/.github/actions/pytest@main
        with:
          python_version: ${{ inputs.python_version }}
          working_directory: ${{ inputs.working_directory }}
          requirements_file: ${{ inputs.pytest_requirements_file || 'requirements.txt' }}
          pytest_version: ${{ inputs.pytest_version || '9.0.2' }}
          pytest_args: ${{ inputs.pytest_args }}
          app_requirements_require_hashes: ${{ inputs.pytest_app_require_hashes && 'true' || 'false' }}

  trivy-repo-scan:
    needs:
      - pre-commit-check
      - gitleaks-scan
      - pytest-test
    if: ${{ inputs.run_trivy && !cancelled() && (needs['pre-commit-check'].result == 'success' || needs['pre-commit-check'].result == 'skipped') && (needs['gitleaks-scan'].result == 'success' || (needs['gitleaks-scan'].result == 'skipped' && inputs.run_gitleaks == false)) && (needs['pytest-test'].result == 'success' || (needs['pytest-test'].result == 'skipped' && inputs.run_pytest == false)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Trivy (repository)
        id: trivy
        uses: thadiust/trivy-scan@main
        with:
          scan_kind: filesystem
          trivy_version: ${{ inputs.trivy_version }}
          working_directory: ${{ inputs.working_directory }}
          mode: ${{ inputs.trivy_mode }}
          paths: ${{ inputs.trivy_paths || '.' }}
          severity: ${{ inputs.trivy_severity || 'HIGH,CRITICAL' }}
          ignore_unfixed: ${{ inputs.trivy_ignore_unfixed != false }}
          fail_on_findings: ${{ inputs.trivy_fail_on_findings != false }}
          write_sarif: ${{ inputs.upload_code_scanning }}
          sarif_filename: trivy-results.sarif

      - name: Upload Trivy repository SARIF to GitHub Code Scanning
        if: ${{ inputs.upload_code_scanning != false && (success() || failure()) && steps.trivy.outputs.sarif_path != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.trivy.outputs.sarif_path }}
          category: trivy

  bandit-scan:
    needs:
      - pre-commit-check
      - gitleaks-scan
      - pytest-test
    if: ${{ inputs.run_bandit && !cancelled() && (needs['pre-commit-check'].result == 'success' || needs['pre-commit-check'].result == 'skipped') && (needs['gitleaks-scan'].result == 'success' || (needs['gitleaks-scan'].result == 'skipped' && inputs.run_gitleaks == false)) && (needs['pytest-test'].result == 'success' || (needs['pytest-test'].result == 'skipped' && inputs.run_pytest == false)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Bandit SAST
        id: bandit
        uses: thadiust/sast-bandit@main
        with:
          python_version: ${{ inputs.python_version }}
          bandit_version: ${{ inputs.bandit_version }}
          working_directory: ${{ inputs.working_directory }}
          targets: ${{ inputs.bandit_targets != '' && inputs.bandit_targets || '.' }}
          exclude: ${{ inputs.bandit_exclude }}
          fail_on_findings: true
          bandit_config: ${{ inputs.bandit_config || '' }}
          minimum_severity: ${{ inputs.bandit_minimum_severity || 'all' }}
          write_sarif: ${{ inputs.upload_code_scanning }}
          sarif_filename: bandit-results.sarif

      - name: Upload Bandit SARIF to GitHub Code Scanning
        if: ${{ inputs.upload_code_scanning != false && (success() || failure()) && steps.bandit.outputs.sarif_path != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.bandit.outputs.sarif_path }}
          category: bandit

  pip-audit-scan:
    needs:
      - pre-commit-check
      - gitleaks-scan
      - pytest-test
    if: ${{ inputs.run_pip_audit_scan && !cancelled() && (needs['pre-commit-check'].result == 'success' || needs['pre-commit-check'].result == 'skipped') && (needs['gitleaks-scan'].result == 'success' || (needs['gitleaks-scan'].result == 'skipped' && inputs.run_gitleaks == false)) && (needs['pytest-test'].result == 'success' || (needs['pytest-test'].result == 'skipped' && inputs.run_pytest == false)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Block unhashed pip-tools when policy requires hashed install
        if: ${{ inputs.enforce_pip_tools_lockfile && inputs.pip_tools_require_hashed_install && inputs.pip_tools_version != '7.5.3' }}
        run: |
          echo "::error::pip_tools_require_hashed_install is true but pip_tools_version is '${{ inputs.pip_tools_version }}' (hashed pip-tools is only bundled for 7.5.3). Use pip_tools_version 7.5.3, set pip_tools_require_hashed_install false, or extend .github/actions/install-pip-tools-hashed/constraints.txt for another version."
          exit 1

      - name: Setup Python (lockfile enforcement)
        if: ${{ inputs.enforce_pip_tools_lockfile }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install pip-tools (hash-pinned for default version)
        if: ${{ inputs.enforce_pip_tools_lockfile && inputs.pip_tools_version == '7.5.3' }}
        uses: thadiust/workflow-python/.github/actions/install-pip-tools-hashed@main

      - name: Install pip-tools (custom version, no bundled hashes)
        if: ${{ inputs.enforce_pip_tools_lockfile && inputs.pip_tools_version != '7.5.3' }}
        run: python -m pip install --disable-pip-version-check -q "pip-tools==${{ inputs.pip_tools_version }}"

      - name: Enforce pip-tools lockfile (pip-compile matches requirements_file)
        if: ${{ inputs.enforce_pip_tools_lockfile }}
        shell: bash
        env:
          WD: ${{ inputs.working_directory }}
          LOCK_FILE: ${{ inputs.requirements_file }}
          IN_FILE: ${{ inputs.pip_tools_requirements_in }}
        run: |
          set -euo pipefail
          if [ -z "$IN_FILE" ] || [ -z "$LOCK_FILE" ]; then
            echo "pip_tools_requirements_in and requirements_file must be non-empty when enforce_pip_tools_lockfile is true." >&2
            exit 1
          fi
          case "$IN_FILE" in
            /*|*..*)
              echo "pip_tools_requirements_in must be relative with no ..: $IN_FILE" >&2
              exit 1
              ;;
          esac
          case "$LOCK_FILE" in
            /*|*..*)
              echo "requirements_file must be relative with no .. when enforcing lockfile: $LOCK_FILE" >&2
              exit 1
              ;;
          esac
          cd "$GITHUB_WORKSPACE/$WD"
          if [ ! -f "$IN_FILE" ]; then
            echo "Missing pip-compile input file: $WD/$IN_FILE" >&2
            exit 1
          fi
          if [ ! -f "$LOCK_FILE" ]; then
            echo "Missing lock file: $WD/$LOCK_FILE" >&2
            exit 1
          fi
          pip-compile "$IN_FILE" -o "$LOCK_FILE" --strip-extras
          cd "$GITHUB_WORKSPACE"
          if [ "$WD" = "." ]; then
            REL="$LOCK_FILE"
          else
            REL="${WD%/}/$LOCK_FILE"
          fi
          echo "Checking $REL is committed in sync with $IN_FILE …"
          git diff --exit-code -- "$REL"

      - name: Run pip-audit scan
        id: pip_audit
        uses: thadiust/pip-audit-scan-action@main
        with:
          python_version: ${{ inputs.python_version }}
          pip_audit_version: ${{ inputs.pip_audit_version }}
          working_directory: ${{ inputs.working_directory }}
          requirements_file: ${{ inputs.requirements_file }}
          fail_on_vuln: ${{ inputs.fail_on_vuln }}

  docker-build:
    needs:
      - pre-commit-check
      - gitleaks-scan
      - pytest-test
      - trivy-repo-scan
      - bandit-scan
      - pip-audit-scan
    if: ${{ inputs.run_docker_build && !cancelled() && (needs['pre-commit-check'].result == 'success' || needs['pre-commit-check'].result == 'skipped') && (needs['gitleaks-scan'].result == 'success' || (needs['gitleaks-scan'].result == 'skipped' && inputs.run_gitleaks == false)) && (needs['pytest-test'].result == 'success' || (needs['pytest-test'].result == 'skipped' && inputs.run_pytest == false)) && (needs['trivy-repo-scan'].result == 'success' || (needs['trivy-repo-scan'].result == 'skipped' && inputs.run_trivy == false)) && (needs['bandit-scan'].result == 'success' || (needs['bandit-scan'].result == 'skipped' && inputs.run_bandit == false)) && (needs['pip-audit-scan'].result == 'success' || (needs['pip-audit-scan'].result == 'skipped' && inputs.run_pip_audit_scan == false)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        env:
          DOCKER_CTX: ${{ inputs.docker_context != '' && inputs.docker_context || inputs.working_directory }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          IMAGE_TAG: ${{ inputs.docker_image_tag }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/${DOCKER_CTX}"
          docker build -f "${DOCKERFILE}" -t "${IMAGE_TAG}" .

      - name: Save image for Trivy scan job
        env:
          IMAGE_TAG: ${{ inputs.docker_image_tag }}
        run: docker save "${IMAGE_TAG}" -o "${RUNNER_TEMP}/trivy-ci-image.tar"

      - name: Upload image tarball
        uses: actions/upload-artifact@v4
        with:
          name: trivy-ci-image
          path: ${{ runner.temp }}/trivy-ci-image.tar
          retention-days: 1
          if-no-files-found: error

  trivy-image-scan:
    needs:
      - docker-build
    if: ${{ inputs.run_trivy_image_scan != false && inputs.run_docker_build && !cancelled() && needs.docker-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: trivy-ci-image
          path: trivy-ci-image-artifact

      - name: Load image into Docker
        run: docker load -i trivy-ci-image-artifact/trivy-ci-image.tar

      - name: Run Trivy (container image)
        id: trivy_image
        uses: thadiust/trivy-scan@main
        with:
          scan_kind: image
          image_ref: ${{ inputs.docker_image_tag }}
          trivy_version: ${{ inputs.trivy_version }}
          working_directory: ${{ inputs.working_directory }}
          severity: ${{ inputs.trivy_severity || 'HIGH,CRITICAL' }}
          ignore_unfixed: ${{ inputs.trivy_ignore_unfixed != false }}
          fail_on_findings: ${{ inputs.trivy_image_fail_on_findings != false }}
          write_sarif: ${{ inputs.upload_code_scanning }}
          sarif_filename: trivy-image-results.sarif

      - name: Upload Trivy image SARIF to GitHub Code Scanning
        if: ${{ inputs.upload_code_scanning != false && (success() || failure()) && steps.trivy_image.outputs.sarif_path != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.trivy_image.outputs.sarif_path }}
          category: trivy-image
