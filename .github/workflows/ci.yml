name: "Python Security Pipeline"

# Least privilege for the default GITHUB_TOKEN (checkout + read-only scans).
permissions:
  contents: read

# One group per repo+ref: new pushes cancel older runs still in progress (saves minutes).
concurrency:
  group: python-security-pipeline-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory containing the Python project to scan"
        required: false
        type: string
        default: "."
      requirements_file:
        description: "Requirements file path relative to working_directory"
        required: false
        type: string
        default: "requirements.txt"
      python_version:
        description: "Python version for lint and scan jobs"
        required: false
        type: string
        default: "3.11"
      fail_on_vuln:
        description: "Fail the pip-audit job when vulnerabilities are found"
        required: false
        type: boolean
        default: true
      run_ruff:
        description: "Whether to run the Ruff lint/format job (runs first when enabled)"
        required: false
        type: boolean
        default: true
      ruff_version:
        description: "Exact Ruff version for the lint job"
        required: false
        type: string
        default: "0.15.9"
      ruff_paths:
        description: "Space-separated paths relative to working_directory for ruff check and format"
        required: false
        type: string
        default: "."
      ruff_config:
        description: "Optional Ruff config path relative to working_directory"
        required: false
        type: string
        default: ""
      run_ruff_format:
        description: "Whether to run ruff format --check after ruff check"
        required: false
        type: boolean
        default: true
      ruff_fail_on_findings:
        description: "Fail the Ruff job when check or format reports work to do"
        required: false
        type: boolean
        default: true
      run_gitleaks:
        description: "Whether to run the Gitleaks secrets scan job (after Ruff when Ruff is enabled)"
        required: false
        type: boolean
        default: true
      run_pip_audit_scan:
        description: "Whether to run the pip-audit dependency scan job"
        required: false
        type: boolean
        default: true
      run_bandit:
        description: "Whether to run the Bandit SAST job"
        required: false
        type: boolean
        default: true
      bandit_config:
        description: "Optional Bandit config file path relative to working_directory (e.g. bandit.yaml)"
        required: false
        type: string
        default: ""
      bandit_minimum_severity:
        description: "Lowest Bandit severity to report and count toward fail_on_findings (all, low, medium, high). Use medium to ignore low-only issues."
        required: false
        type: string
        default: "all"
  workflow_dispatch:
    inputs:
      working_directory:
        description: "Directory containing the Python project to scan"
        required: false
        type: string
        default: "."
      requirements_file:
        description: "Requirements file path relative to working_directory"
        required: false
        type: string
        default: "requirements.txt"
      python_version:
        description: "Python version for lint and scan jobs"
        required: false
        type: string
        default: "3.11"
      fail_on_vuln:
        description: "Fail the pip-audit job when vulnerabilities are found"
        required: false
        type: boolean
        default: true
      run_ruff:
        description: "Whether to run the Ruff lint/format job (runs first when enabled)"
        required: false
        type: boolean
        default: true
      ruff_version:
        description: "Exact Ruff version for the lint job"
        required: false
        type: string
        default: "0.15.9"
      ruff_paths:
        description: "Space-separated paths relative to working_directory for ruff check and format"
        required: false
        type: string
        default: "."
      ruff_config:
        description: "Optional Ruff config path relative to working_directory"
        required: false
        type: string
        default: ""
      run_ruff_format:
        description: "Whether to run ruff format --check after ruff check"
        required: false
        type: boolean
        default: true
      ruff_fail_on_findings:
        description: "Fail the Ruff job when check or format reports work to do"
        required: false
        type: boolean
        default: true
      run_gitleaks:
        description: "Whether to run the Gitleaks secrets scan job (after Ruff when Ruff is enabled)"
        required: false
        type: boolean
        default: true
      run_pip_audit_scan:
        description: "Whether to run the pip-audit dependency scan job"
        required: false
        type: boolean
        default: true
      run_bandit:
        description: "Whether to run the Bandit SAST job"
        required: false
        type: boolean
        default: true
      bandit_config:
        description: "Optional Bandit config file path relative to working_directory (e.g. bandit.yaml)"
        required: false
        type: string
        default: ""
      bandit_minimum_severity:
        description: "Lowest Bandit severity to report and count toward fail_on_findings (all, low, medium, high). Use medium to ignore low-only issues."
        required: false
        type: string
        default: "all"

jobs:
  # Ruff first (fast dev gate); then Gitleaks; Bandit and pip-audit stay parallel after secrets.
  ruff-lint:
    if: ${{ inputs.run_ruff }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Ruff
        uses: thadiust/workflow-python/.github/actions/ruff@main
        with:
          python_version: ${{ inputs.python_version }}
          ruff_version: ${{ inputs.ruff_version }}
          working_directory: ${{ inputs.working_directory }}
          paths: ${{ inputs.ruff_paths }}
          config: ${{ inputs.ruff_config }}
          run_format_check: ${{ inputs.run_ruff_format }}
          fail_on_findings: ${{ inputs.ruff_fail_on_findings }}

  gitleaks-scan:
    needs:
      - ruff-lint
    if: ${{ inputs.run_gitleaks && !cancelled() && (needs['ruff-lint'].result == 'success' || needs['ruff-lint'].result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        id: gitleaks
        uses: thadiust/secrets-gitleaks@main
        with:
          working_directory: ${{ inputs.working_directory }}
          fail_on_findings: true

  bandit-scan:
    needs:
      - ruff-lint
      - gitleaks-scan
    if: ${{ inputs.run_bandit && !cancelled() && (needs['ruff-lint'].result == 'success' || needs['ruff-lint'].result == 'skipped') && (needs['gitleaks-scan'].result == 'success' || needs['gitleaks-scan'].result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Bandit SAST
        id: bandit
        uses: thadiust/sast-bandit@main
        with:
          python_version: ${{ inputs.python_version }}
          working_directory: ${{ inputs.working_directory }}
          targets: "."
          fail_on_findings: true
          bandit_config: ${{ inputs.bandit_config }}
          minimum_severity: ${{ inputs.bandit_minimum_severity }}

  pip-audit-scan:
    needs:
      - ruff-lint
      - gitleaks-scan
    if: ${{ inputs.run_pip_audit_scan && !cancelled() && (needs['ruff-lint'].result == 'success' || needs['ruff-lint'].result == 'skipped') && (needs['gitleaks-scan'].result == 'success' || needs['gitleaks-scan'].result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run pip-audit scan
        id: pip_audit
        uses: thadiust/pip-audit-scan-action@main
        with:
          python_version: ${{ inputs.python_version }}
          working_directory: ${{ inputs.working_directory }}
          requirements_file: ${{ inputs.requirements_file }}
          fail_on_vuln: ${{ inputs.fail_on_vuln }}
