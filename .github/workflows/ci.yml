name: "Python Security Pipeline"

# Least privilege for the default GITHUB_TOKEN (checkout + read-only scans).
permissions:
  contents: read

# One group per repo+ref: new pushes cancel older runs still in progress (saves minutes).
concurrency:
  group: python-security-pipeline-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory containing the Python project to scan"
        required: false
        type: string
        default: "."
      requirements_file:
        description: "Requirements file path relative to working_directory"
        required: false
        type: string
        default: "requirements.txt"
      python_version:
        description: "Python version for lint and scan jobs"
        required: false
        type: string
        default: "3.11"
      fail_on_vuln:
        description: "Fail the pip-audit job when vulnerabilities are found"
        required: false
        type: boolean
        default: true
      run_ruff:
        description: "Whether to run the Ruff lint/format job (runs first when enabled)"
        required: false
        type: boolean
        default: true
      ruff_version:
        description: "Exact Ruff version for the lint job"
        required: false
        type: string
        default: "0.15.9"
      ruff_paths:
        description: "Space-separated paths relative to working_directory for ruff check and format"
        required: false
        type: string
        default: "."
      ruff_config:
        description: "Optional Ruff config path relative to working_directory"
        required: false
        type: string
        default: ""
      run_ruff_format:
        description: "Whether to run ruff format --check after ruff check"
        required: false
        type: boolean
        default: true
      ruff_fail_on_findings:
        description: "Fail the Ruff job when check or format reports work to do"
        required: false
        type: boolean
        default: true
      run_pytest:
        description: "Whether to run pytest (runs in parallel with Ruff when both are enabled)"
        required: false
        type: boolean
        default: true
      pytest_requirements_file:
        description: "Requirements file path (relative to working_directory) used for pytest installs"
        required: false
        type: string
        default: "requirements.txt"
      pytest_version:
        description: "Exact pytest version for the test job"
        required: false
        type: string
        default: "9.0.2"
      pytest_args:
        description: "Space-separated pytest args. Leave empty for auto: -q tests if ./tests exists, else -q test if ./test exists, else -q (discovery)."
        required: false
        type: string
        default: ""
      run_gitleaks:
        description: "Whether to run the Gitleaks secrets scan job (after Ruff when Ruff is enabled)"
        required: false
        type: boolean
        default: true
      run_pip_audit_scan:
        description: "Whether to run the pip-audit dependency scan job"
        required: false
        type: boolean
        default: true
      run_bandit:
        description: "Whether to run the Bandit SAST job"
        required: false
        type: boolean
        default: true
      bandit_config:
        description: "Optional Bandit config file path relative to working_directory (e.g. bandit.yaml)"
        required: false
        type: string
        default: ""
      bandit_exclude:
        description: "Comma-separated paths to exclude from Bandit (relative to working_directory). Empty = scan the whole tree including tests (recommended). Use e.g. tests if you need to drop test dirs from Bandit."
        required: false
        type: string
        default: ""
      bandit_minimum_severity:
        description: "Lowest Bandit severity to report and count toward fail_on_findings (all, low, medium, high). Use medium to ignore low-only issues."
        required: false
        type: string
        default: "all"

      upload_code_scanning:
        description: "Upload Bandit and Gitleaks SARIF to GitHub Code Scanning (Security tab / PR). Caller job needs security-events: write. No-op if Advanced Security is off (upload step uses continue-on-error)."
        required: false
        type: boolean
        default: true

jobs:
  # Logs documented runner context (no runner.version in schema — use os/arch/environment/name).
  runner-info:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Runner info
        run: |
          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          echo "runner.environment=${{ runner.environment }}"
          echo "runner.name=${{ runner.name }}"

  # Ruff first (fast dev gate); then Gitleaks; Bandit and pip-audit stay parallel after secrets.
  ruff-lint:
    if: ${{ inputs.run_ruff }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # Local paths (`./.github/actions/...`) resolve on the *caller* repo when this workflow is reused — use the workflow-python repo ref.
      - name: Run Ruff
        uses: thadiust/workflow-python/.github/actions/ruff@main
        with:
          python_version: ${{ inputs.python_version }}
          ruff_version: ${{ inputs.ruff_version }}
          working_directory: ${{ inputs.working_directory }}
          paths: ${{ inputs.ruff_paths || '.' }}
          config: ${{ inputs.ruff_config || '' }}
          run_format_check: ${{ inputs.run_ruff_format != false }}
          fail_on_findings: ${{ inputs.ruff_fail_on_findings != false }}

  pytest-test:
    if: ${{ inputs.run_pytest && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run pytest
        uses: thadiust/workflow-python/.github/actions/pytest@main
        with:
          python_version: ${{ inputs.python_version }}
          working_directory: ${{ inputs.working_directory }}
          requirements_file: ${{ inputs.pytest_requirements_file || 'requirements.txt' }}
          pytest_version: ${{ inputs.pytest_version || '9.0.2' }}
          pytest_args: ${{ inputs.pytest_args }}

  gitleaks-scan:
    needs:
      - ruff-lint
      - pytest-test
    if: ${{ inputs.run_gitleaks && !cancelled() && (needs['ruff-lint'].result == 'success' || needs['ruff-lint'].result == 'skipped') && (needs['pytest-test'].result == 'success' || needs['pytest-test'].result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        id: gitleaks
        uses: thadiust/secrets-gitleaks@v1.0.2
        with:
          working_directory: ${{ inputs.working_directory }}
          fail_on_findings: true
          write_sarif: ${{ inputs.upload_code_scanning }}
          sarif_filename: gitleaks-results.sarif

      - name: Upload Gitleaks SARIF to GitHub Code Scanning
        if: ${{ inputs.upload_code_scanning != false && (success() || failure()) && steps.gitleaks.outputs.sarif_path != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.gitleaks.outputs.sarif_path }}
          category: gitleaks

  bandit-scan:
    needs:
      - ruff-lint
      - gitleaks-scan
      - pytest-test
    if: ${{ inputs.run_bandit && !cancelled() && (needs['ruff-lint'].result == 'success' || needs['ruff-lint'].result == 'skipped') && (needs['gitleaks-scan'].result == 'success' || needs['gitleaks-scan'].result == 'skipped') && (needs['pytest-test'].result == 'success' || needs['pytest-test'].result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Bandit SAST
        id: bandit
        uses: thadiust/sast-bandit@v1.0.1
        with:
          python_version: ${{ inputs.python_version }}
          working_directory: ${{ inputs.working_directory }}
          targets: "."
          exclude: ${{ inputs.bandit_exclude }}
          fail_on_findings: true
          bandit_config: ${{ inputs.bandit_config || '' }}
          minimum_severity: ${{ inputs.bandit_minimum_severity || 'all' }}
          write_sarif: ${{ inputs.upload_code_scanning }}
          sarif_filename: bandit-results.sarif

      - name: Upload Bandit SARIF to GitHub Code Scanning
        if: ${{ inputs.upload_code_scanning != false && (success() || failure()) && steps.bandit.outputs.sarif_path != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.bandit.outputs.sarif_path }}
          category: bandit

  pip-audit-scan:
    needs:
      - ruff-lint
      - gitleaks-scan
      - pytest-test
    if: ${{ inputs.run_pip_audit_scan && !cancelled() && (needs['ruff-lint'].result == 'success' || needs['ruff-lint'].result == 'skipped') && (needs['gitleaks-scan'].result == 'success' || needs['gitleaks-scan'].result == 'skipped') && (needs['pytest-test'].result == 'success' || needs['pytest-test'].result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run pip-audit scan
        id: pip_audit
        uses: thadiust/pip-audit-scan-action@v1.0.0
        with:
          python_version: ${{ inputs.python_version }}
          working_directory: ${{ inputs.working_directory }}
          requirements_file: ${{ inputs.requirements_file }}
          fail_on_vuln: ${{ inputs.fail_on_vuln }}
