name: Dependency Review

on:
  workflow_call:

# Do not set concurrency here: callers already define it, and matching
# group/name with the parent workflow triggers a GitHub deadlock on PRs.

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5
