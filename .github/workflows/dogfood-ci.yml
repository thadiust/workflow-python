# Integration test: run the full reusable ci.yml against a tiny in-repo fixture whenever the pipeline changes.
name: Dogfood (integration)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/dogfood-ci.yml"
      - ".github/workflows/python-pr-suite.yml"
      - ".github/actions/**"
      - "dogfood/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/dogfood-ci.yml"
      - ".github/workflows/python-pr-suite.yml"
      - ".github/actions/**"
      - "dogfood/**"
  workflow_dispatch:

concurrency:
  group: dogfood-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  full-pipeline:
    uses: ./.github/workflows/ci.yml
    with:
      working_directory: dogfood
      run_docker_build: true
      dockerfile: Dockerfile
      trivy_image_fail_on_findings: false
      run_runner_info: false

  pr-suite-smoke:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/python-pr-suite.yml
    with:
      working_directory: dogfood
      run_docker_build: false
