# Integration test: python-pr-suite.yml on pull requests (dependency-review + ci.yml).
name: Dogfood (PR suite)

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/dogfood-ci.yml"
      - ".github/workflows/dogfood-pr-suite.yml"
      - ".github/workflows/python-pr-suite.yml"
      - ".github/actions/**"
      - "dogfood/**"
  workflow_dispatch:

concurrency:
  group: dogfood-pr-suite-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  pr-suite-smoke:
    uses: ./.github/workflows/python-pr-suite.yml
    with:
      working_directory: dogfood
      run_docker_build: false
