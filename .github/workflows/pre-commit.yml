# Enforces .pre-commit-config.yaml on every push/PR (same as pre-commit run --all-files locally).
name: pre-commit

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pre-commit-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: pre-commit/action@v3.0.0
