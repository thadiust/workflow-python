# Reusable: Dependency Review + full ci.yml (parallel jobs).
# For apps that need more ci.yml inputs than listed here, call dependency-review.yml and ci.yml in two jobs (see README).
name: Python PR suite (dependency review + security pipeline)

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Forwarded to ci.yml (project root relative to repo)"
        required: false
        type: string
        default: "."
      requirements_file:
        description: "Forwarded to ci.yml"
        required: false
        type: string
        default: "requirements.txt"
      enforce_pip_tools_lockfile:
        description: "Forwarded to ci.yml"
        required: false
        type: boolean
        default: false
      pip_tools_requirements_in:
        description: "Forwarded to ci.yml when enforce_pip_tools_lockfile is true"
        required: false
        type: string
        default: "requirements.in"
      run_docker_build:
        description: "Forwarded to ci.yml"
        required: false
        type: boolean
        default: false
      dockerfile:
        description: "Forwarded to ci.yml when run_docker_build is true"
        required: false
        type: string
        default: "Dockerfile"
      trivy_image_fail_on_findings:
        description: "Forwarded to ci.yml (Trivy image job)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  dependency-review:
    uses: ./.github/workflows/dependency-review.yml

  python-security-pipeline:
    uses: ./.github/workflows/ci.yml
    with:
      working_directory: ${{ inputs.working_directory }}
      requirements_file: ${{ inputs.requirements_file }}
      enforce_pip_tools_lockfile: ${{ inputs.enforce_pip_tools_lockfile }}
      pip_tools_requirements_in: ${{ inputs.pip_tools_requirements_in }}
      run_docker_build: ${{ inputs.run_docker_build }}
      dockerfile: ${{ inputs.dockerfile }}
      trivy_image_fail_on_findings: ${{ inputs.trivy_image_fail_on_findings }}
