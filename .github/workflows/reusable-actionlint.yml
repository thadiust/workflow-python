# Call from other repositories with:
#   uses: thadiust/workflow-python/.github/workflows/reusable-actionlint.yml@v1.0.8
# This repo's own actionlint.yml uses ./reusable-actionlint.yml (same ref as the push).
name: "Reusable actionlint"

on:
  workflow_call:
    inputs:
      actionlint_version:
        description: "actionlint release version (https://github.com/rhysd/actionlint/releases)"
        required: false
        type: string
        default: "1.7.12"
      validate_composite_actions:
        description: "If true, PyYAML-parse every .github/actions/**/action.yml (and action.yaml)"
        required: false
        type: boolean
        default: false
      validate_root_action_yml:
        description: "If true, PyYAML-parse action.yml at the repository root (composite action repos)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: ${{ inputs.actionlint_version }}
        run: |
          set -euo pipefail
          # Ubuntu/Linux amd64 only. Self-hosted runners may need `sha256sum` and an executable temp dir.
          ASSET="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          BASE_URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL "${BASE_URL}/actionlint_${ACTIONLINT_VERSION}_checksums.txt" -o /tmp/actionlint_checksums.txt
          curl -fsSL "${BASE_URL}/${ASSET}" -o "/tmp/${ASSET}"

          EXPECTED="$(awk -v f="${ASSET}" '$2 == f { print $1; exit }' /tmp/actionlint_checksums.txt)"
          if [ -z "${EXPECTED}" ]; then
            echo "No SHA256 line for ${ASSET} in upstream checksums (wrong actionlint_version or renamed asset?)." >&2
            exit 1
          fi
          ACTUAL="$(sha256sum "/tmp/${ASSET}" | awk '{ print $1 }')"
          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "SHA256 mismatch for ${ASSET} (expected ${EXPECTED}, got ${ACTUAL})." >&2
            exit 1
          fi

          rm -f /tmp/actionlint_checksums.txt
          tar -xzf "/tmp/${ASSET}" -C /tmp
          rm -f "/tmp/${ASSET}"

          install_dir="$HOME/.local/bin"
          mkdir -p "$install_dir"
          install -m755 /tmp/actionlint "$install_dir/actionlint"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Lint workflow YAML
        run: actionlint -color

      - name: Setup Python (composite / root action YAML parse)
        if: ${{ inputs.validate_composite_actions || inputs.validate_root_action_yml }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate composite action.yml files parse
        if: ${{ inputs.validate_composite_actions }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q "pyyaml==6.0.3"
          python - <<'PY'
          import pathlib
          import sys
          import yaml

          root = pathlib.Path(".github/actions")
          if not root.is_dir():
              sys.exit(0)
          paths = sorted(
              p
              for p in root.rglob("*")
              if p.is_file() and p.name in ("action.yml", "action.yaml")
          )
          if not paths:
              sys.exit(0)
          for p in paths:
              yaml.safe_load(p.read_text(encoding="utf-8"))
              print("ok", p)
          PY

      - name: Validate root action.yml parses
        if: ${{ inputs.validate_root_action_yml }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q "pyyaml==6.0.3"
          python -c "import yaml; yaml.safe_load(open('action.yml', encoding='utf-8'))"
