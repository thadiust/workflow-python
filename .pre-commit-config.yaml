# Required locally: pip install pre-commit && pre-commit install
# Full tree (Cisco-style): pre-commit run --all-files
# CI: .github/workflows/pre-commit.yml
#
# Formatting: Ruff replaces Black + isort here — do not add psf/black (would fight ruff-format).

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # GitHub workflow keys like `on:` are invalid in YAML 1.1 — validate other YAML only
        exclude: ^\.github/workflows/
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
      - id: debug-statements
        language_version: python3

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
