# Required locally: pip install pre-commit && pre-commit install
# Cisco-style full tree: pre-commit run --all-files
# CI runs the same on push/PR (.github/workflows/pre-commit.yml).

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
