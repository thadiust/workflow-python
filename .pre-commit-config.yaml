# Required locally: pip install pre-commit && pre-commit install
# Full tree (Cisco-style): pre-commit run --all-files
# CI: reusable ci.yml (pre-commit-check job) on every caller; this repo also runs .github/workflows/pre-commit.yml on push/PR.
#
# actionlint: GitHub Actions workflow semantics (not YAML-1.1 check-yaml). Composite action.yml parse: scripts/validate_composite_actions_yaml.py.
# Formatting: Black formats; Ruff is lint-only (ruff check --fix). Do not add ruff-format — it would fight Black.

fail_fast: true

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^\.github/workflows/
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
      - id: debug-statements
        language_version: python3

  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: composite-action-yaml-parse
        name: PyYAML parse .github/actions composites
        language: python
        additional_dependencies: [pyyaml==6.0.2]
        entry: python scripts/validate_composite_actions_yaml.py
        pass_filenames: false
        files: ^(\.github/actions/.*|scripts/validate_composite_actions_yaml\.py)$
